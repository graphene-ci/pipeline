lint:
  use:
    - DEFAULT
  service_suffix: API
deps:
  - github.com/gopherex/schemapb
generate:
  inputs:
    - directory: proto
  plugins:
    - name: go
      out: .
      opts:
        module: github.com/graphene-ci/pipeline
    - name: go-grpc
      out: .
      opts:
        module: github.com/graphene-ci/pipeline
