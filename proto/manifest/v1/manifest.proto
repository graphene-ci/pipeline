// The pipeline manifest: everything the recording pass discovers about
// one pipeline binary — published on every worker start, shown by the
// CLI/UI before any run exists.
syntax = "proto3";

package graphene.manifest.v1;

import "schemapb/schema.proto";

option go_package = "github.com/graphene-ci/pipeline/pkg/proto/manifest/v1;manifestpb";

message Manifest {
  string pipeline_id = 1;
  // Params/Result are gopherex schemapb schemas: the runtime
  // form/validation descriptor a UI renders and validates against
  // (four-language consumers, CEL rules).
  schemapb.Schema params_schema = 2;
  schemapb.Schema result_schema = 3;
  // Activities discovered by the recording pass (wire names, sorted).
  repeated string activities = 4;
  // Kinds are the entity kinds the pipeline's libraries declare.
  repeated string kinds = 5;
  // Triggers declared on the pipeline; the server applies them on
  // publish — the code is the source of truth, a removed trigger is
  // unapplied by the next push.
  repeated Trigger triggers = 6;
  // Concurrency policy for AUTOMATIC starts: "queue" (default),
  // "cancel-previous", "parallel".
  string concurrency = 7;
  // Graph is the plan of the optimistic zero path.
  Graph graph = 8;
  // KindDecls describe the brought kinds fully — the dictionary entry
  // material: what a declaration looks like, which commands the kind
  // answers, which observation dimensions it serves. `kinds` stays the
  // quick name list; an entry here always has a name there.
  repeated KindDecl kind_decls = 9;
}

// KindDecl is one brought kind, described the way the installation's
// dictionary wants it.
message KindDecl {
  string name = 1;
  string description = 2;
  // SpecSchema is the declaration's schema.
  schemapb.Schema spec_schema = 3;
  message Command {
    string name = 1;
    schemapb.Schema payload_schema = 2;
  }
  repeated Command commands = 4;
  // Dimensions: state, events, logs, metrics, traces.
  repeated string dimensions = 5;
}

// Graph is the pipeline's PLAN: what the recording pass saw walking
// the OPTIMISTIC ZERO PATH once — declared resources with their tree
// edges and the ordered steps with their data dependencies. Branches
// on runtime values are invisible by construction: this is the shape
// of the honest common path, not an execution guarantee.
message Graph {
  repeated GraphNode nodes = 1;
  repeated GraphStep steps = 2;
}

message GraphNode {
  // Ref addresses the declared resource ("kind/id").
  string ref = 1;
  // Parent is the declared owner; empty means the run.
  string parent = 2;
  // Children are existing resources the declaration claims.
  repeated string children = 3;
}

message GraphStep {
  // Op: "declare" | "activity" | "activity-all" | "attach" | "transfer".
  string op = 1;
  // Subject: the resource ref or the activity name.
  string subject = 2;
  // Agent executing an activity ("agent/x", or "<selection>" for a
  // fan-out).
  string agent = 3;
  // Note: the guarantee ("at-most-once"), the transfer target, ...
  string note = 4;
  // Deps are resources whose Ready output fed this step.
  repeated string deps = 5;
}

message Trigger {
  // Kind: "cron" | "webhook".
  string kind = 1;
  // Name identifies the trigger; webhooks are addressed by it
  // (/hooks/{ns}/{pipeline}/{name}). Crons name their history events.
  string name = 2;
  // Spec is the cron expression (cron only).
  string spec = 3;
  // SecretName names the HMAC/token secret in the installation's store
  // (webhook only).
  string secret_name = 4;
  // Params is the fixed typed-params JSON this trigger starts runs
  // with; a webhook's request body lands in the reserved "event" field
  // on top.
  bytes params = 5;
}
