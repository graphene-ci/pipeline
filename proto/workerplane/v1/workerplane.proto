// Worker plane: what the RUNNING USER CODE calls — secrets at the point
// of use, capabilities from where they were installed, blob bytes. The
// namespace comes from the worker's token; a worker cannot ask for
// another namespace's anything. The contract lives in the pipeline
// repository — the worker side owns it; the server imports and serves.
syntax = "proto3";

package graphene.workerplane.v1;

option go_package = "github.com/graphene-ci/pipeline/pkg/proto/workerplane/v1;workerplanev1";

// SecretsAPI resolves secret names to values — exactly once, at the
// point of use; the value never travels back into records.
service SecretsAPI {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
}

message GetSecretRequest {
  string name = 1;
}

message GetSecretResponse {
  string value = 1;
}

// CapabilitiesAPI publishes what a machine now CAN — written down where
// the installation happened.
service CapabilitiesAPI {
  rpc PublishCapability(PublishCapabilityRequest) returns (PublishCapabilityResponse);
}

message Capability {
  string name = 1;
  // Version is informative; matching is by label equality only.
  string version = 2;
  map<string, string> labels = 3;
  // BroughtBy is free text: an installer, a person, an image.
  string brought_by = 4;
  bool ready = 5;
}

message PublishCapabilityRequest {
  string agent_id = 1;
  Capability capability = 2;
}

message PublishCapabilityResponse {}

// BlobsAPI moves artifact bytes. Content-addressed: the digest IS the
// location; a repeated Put of the same bytes is a no-op by construction.
service BlobsAPI {
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
}

message PutBlobRequest {
  // Chunks of the blob, in order.
  bytes chunk = 1;
}

message PutBlobResponse {
  // Digest is "sha256:<hex>"; Location addresses the bytes in the store.
  string digest = 1;
  string location = 2;
  int64 size = 3;
}

message GetBlobRequest {
  string location = 1;
}

message GetBlobResponse {
  bytes chunk = 1;
}

// EventsAPI carries DOMAIN EVENTS into an entity's history — the plane
// of truth. A note is a milestone, not a log line: streams belong in
// telemetry.
service EventsAPI {
  rpc Emit(EmitRequest) returns (EmitResponse);
}

message EmitRequest {
  // Ref addresses the entity ("kind/id").
  string ref = 1;
  string name = 2;
  // Payload is the event's body as JSON.
  bytes payload = 3;
}

message EmitResponse {}

// ManifestAPI records what a pipeline binary IS: published on every
// worker start and on every push, deduplicated by content server-side.
service ManifestAPI {
  rpc PublishManifest(PublishManifestRequest) returns (PublishManifestResponse);
  // GetPipeline reads the pipeline record: the current image and the
  // last published manifest. A push compares its image against this to
  // skip an unchanged publication.
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse);
}

message PublishManifestRequest {
  // Manifest is graphene.manifest.v1.Manifest as protojson — kept as
  // bytes so the worker plane needs no cross-file proto import.
  bytes manifest = 1;
  // Image, when set, records the worker image this manifest was
  // published from — a push sets it; a worker start leaves it empty to
  // keep the record's current image.
  string image = 2;
}

message PublishManifestResponse {}

message GetPipelineRequest {
  string pipeline_id = 1;
}

message GetPipelineResponse {
  // Image is the current worker image of the pipeline; empty when the
  // pipeline was never pushed.
  string image = 1;
  // Manifest is the last published manifest as protojson.
  bytes manifest = 2;
  string digest = 3;
}

// RunsAPI starts and observes runs of THIS pipeline from its own
// binary — the `run` subcommand. The management plane serves operators;
// this door serves the user code itself, with the same run token that
// authenticates the rest of the worker plane.
service RunsAPI {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // RunResult waits for the run to finish and returns its typed result
  // as JSON.
  rpc RunResult(RunResultRequest) returns (RunResultResponse);
}

message StartRunRequest {
  string run_id = 1;
  // Pipeline is the workflow type on the wire — the pipeline id.
  string pipeline = 2;
  // Params is the typed params value of the pipeline, as JSON.
  bytes params = 3;
  // Image makes the run MANAGED: the server launches the worker
  // container itself.
  string image = 4;
  map<string, string> labels = 5;
}

message StartRunResponse {
  string workflow_id = 1;
  string temporal_run_id = 2;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  string status = 1;
}

message RunResultRequest {
  string run_id = 1;
}

message RunResultResponse {
  // Result is the run's typed Result as JSON.
  bytes result = 1;
}
